lett.125.248101", "quote": "mean-field theories for quadratic integrate-and-fire neurons with electrical synapses have been recently put forward", "retrieved": "2026-10-02"}}, {"id": "prob", "slot": "problem", "orbit": 1, "label": "Unrealistic symmetric-spike assumption", "detail": "Validity of existing theories is controversial.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1103/physrevlett.125.248101", "quote": "the validity of these theories is controversial since they assume that the neurons produce unrealistic, symmetric spikes, ignoring the well-known impact of spike shape on synchronization", "retrieved": "2026-10-02"}}, {"id": "appl", "slot": "application", "orbit": 1, "label": "Explaining electrically coupled synchrony", "detail": "Precise mathematical explanation of gap-junction effects.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1103/physrevlett.125.248101", "quote": "Our results offer a precise mathematical explanation of the intricate effect of electrical synapses in collective synchronization.", "retrieved": "2026-10-02"}}, {"id": "fam", "slot": "family", "orbit": 2, "label": "Exact mean-field (MPR) theory", "detail": "Exact reductions of spiking populations to macroscopic equations.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1103/physrevlett.125.248101", "quote": "mean-field theories for quadratic integrate-and-fire neurons with electrical synapses have been recently put forward", "retrieved": "2026-10-02"}}, {"id": "nov", "slot": "novelty", "orbit": 1, "label": "Equalizing potentials favors synchrony", "detail": "First facet of the dual role.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1103/physrevlett.125.248101", "quote": "they equalize membrane potentials favoring the emergence of synchrony", "retrieved": "2026-10-02"}}, {"id": "res", "slot": "result", "orbit": 3, "label": "Dual role revealed by the equations", "detail": "Mean-field equations show two effects.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1103/physrevlett.125.248101", "quote": "The resulting mean-field equations reveal a dual role of electrical synapses", "retrieved": "2026-10-02"}}, {"id": "con", "slot": "conclusion", "orbit": 3, "label": "Reconciles theory and numerics", "detail": "Confirms suitability of low-dimensional mean-field theories.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1103/physrevlett.125.248101", "quote": "This reconciles previous theoretical and numerical works, and confirms the suitability of recent low-dimensional mean-field theories to investigate electrically coupled neuronal networks.", "retrieved": "2026-10-02"}}]}, {"id": "s07", "title": "Neuronal Cascades Shape Whole-Brain Functional Dynamics at Rest", "planets": [{"id": "sun", "slot": "sun", "orbit": 0, "label": "Neuronal Cascades Shape Whole-Brain Functional Dynamics at Rest", "detail": "Identifies neuronal cascades as a mechanism of resting dynamics.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1523/eneuro.0283-21.2021", "quote": "Here, we identify neuronal cascades as a potential mechanism.", "retrieved": "2026-10-02"}}, {"id": "app", "slot": "topic_app", "orbit": 1, "label": "Resting-state FC states", "detail": "Recurrent functional connectivity states at rest.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1523/eneuro.0283-21.2021", "quote": "At rest, mammalian brains display remarkable spatiotemporal complexity", "retrieved": "2026-10-02"}}, {"id": "ai", "slot": "topic_ai", "orbit": 1, "label": "Full-brain network model of populations", "detail": "Populations coupled by a detailed connectome produce cascades.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1523/eneuro.0283-21.2021", "quote": "Using full-brain network modeling, we show that neuronal populations, coupled via a detailed structural connectome, give rise to large-scale casca y explains subject differences", "detail": "Topological measures explain recruitment differences.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.3389/fnsys.2021.675272", "quote": "We further exploit topological network measures in order to explain the differences and the analogies among the subjects and their brain regions, in showing recruitment events at different parameter values.", "retrieved": "2026-10-02"}}, {"id": "con", "slot": "conclusion", "orbit": 3, "label": "Connectivity variation explains dynamics", "detail": "Individual structure explains disorder dynamics.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.3389/fnsys.2021.675272", "quote": "individual variations in structural connectivity, when linked with mathematical dynamic models, have the capacity to explain changes in spatiotemporal organization of brain dynamics, as observed in network-based brain disorders", "retrieved": "2026-10-02"}}]}, {"id": "s09", "title": "Whole brain functional connectivity: Insights from next generation neural mass modelling incorporating electrical synapses", "planets": [{"id": "sun", "slot": "sun", "orbit": 0, "label": "Whole-brain FC from NGNMM with electrical synapses", "detail": "Generates FC patterns with Human Connectome Project data.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1371/journal.pcbi.1012647", "quote": "Here we demonstrate the ability of this new modelling framework, when combined with data from the Human Connectome Project, to generate patterns of functional connectivity (FC) of the type observed in both magnetoencephalography and functional magnetic resonance neuroimaging.", "retrieved": "2026-10-02"}}, {"id": "app", "slot": "topic_app", "orbit": 1, "label": "Connectome-based whole-brain activity", "detail": "Connectome availability inspired whole-brain modelling.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1371/journal.pcbi.1012647", "quote": "The ready ation Through Coherence", "detail": "Oscillations reflect rhythmic excitability.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1371/journal.pcbi.1009342", "quote": "The Communication Through Coherence (CTC) theory proposes that oscillations reflect rhythmic changes in excitability of the neuronal populations.", "retrieved": "2026-10-02"}}, {"id": "ai", "slot": "topic_ai", "orbit": 1, "label": "Exact mean-field of the spiking network", "detail": "Low-dimensional exact description of E-I QIF network.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1371/journal.pcbi.1009342", "quote": "We use recently developed mean-field models which provide an exact description of the macroscopic activity of the spiking network.", "retrieved": "2026-10-02"}}, {"id": "prob", "slot": "problem", "orbit": 1, "label": "Inputs must be phase-locked to communicate", "detail": "Volleys must hit excitability peaks.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1371/journal.pcbi.1009342", "quote": "populations need to be properly phase-locked so that input volleys arrive at the peaks of excitability of the receiving population to communicate effectively", "retrieved": "2026-10-02"}}, {"id": "appl", "slot": "application", "orbit": 1, "label": "Selective attention switching", "detail": "Pulsatile inputs switch between attended inputs.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1371/journal.pcbi.1009342", "quote": "Finally, we show that pulsatile inputs can switch between attended inputs in selective attention.", "retrieved": "2026-10-02"}}, {"id": "fam", "slot": "family", "orbit": 2, "label": "NGNMM on whole-brain connectomes", "detail": "Exact-reduction neural masses embedded in connectome networks.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1371/journal.pcbi.1009342", "quote": "We use recently developed mean-field models which provide an exact description of the macroscopi 931-9", "quote": "neurolib is a computational framework for whole-brain modeling written in Python.", "retrieved": "2026-10-02"}}, {"id": "app", "slot": "topic_app", "orbit": 1, "label": "Connectome-coupled brain regions", "detail": "Regions linked by structural connectivity.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s12559-021-09931-9", "quote": "In a whole-brain network model, brain regions are connected with each other based on biologically informed structural connectivity, i.e., the connectome of the brain.", "retrieved": "2026-10-02"}}, {"id": "ai", "slot": "topic_ai", "orbit": 1, "label": "Library of neural mass models", "detail": "Mesoscopic average-activity models per region.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s12559-021-09931-9", "quote": "It provides a set of neural mass models that represent the average activity of a brain region on a mesoscopic scale.", "retrieved": "2026-10-02"}}, {"id": "prob", "slot": "problem", "orbit": 1, "label": "End-to-end modeling workflow", "detail": "Load data, set up, simulate and analyze models.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s12559-021-09931-9", "quote": "neurolib can load structural and functional datasets, set up a whole-brain model, manage its parameters, simulate it, and organize its outputs for later analysis.", "retrieved": "2026-10-02"}}, {"id": "appl", "slot": "application", "orbit": 1, "label": "Platform for prototyping and experiments", "detail": "Versatile platform for computational neuroscientists.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s12559-021-09931-9", "quote": "offering a versatile platform for computational neuroscientists for prototyping models, managing large numerical experiments", "retrieved": "2026-10-02"}}, {"id": "fam", "slot": "family", "orbit": 2, "label": "Classical neural-mass whole-brain frameworks", "detail": "Phenomenological or biophysical amics", "retrieved": "2026-10-02"}}]}, {"id": "s25", "title": "Comparing hemodynamic models with DCM", "planets": [{"id": "sun", "slot": "sun", "orbit": 0, "label": "Comparing hemodynamic models with DCM", "detail": "Compares eight BOLD hemodynamic forward-model variants embedded in a DCM.", "provenance": "grouped", "evidence": {"origin": "local:PosiblesPapers/1-s2.0-S1053811907006489-main.pdf", "quote": "In this article, we address this question by embedding different variants of the BOLD signal equation in a well-established DCM of functional interactions among visual areas.", "retrieved": "2026-10-05"}}, {"id": "app", "slot": "topic_app", "orbit": 1, "label": "BOLD response modelling", "detail": "Neuroscience framing: biophysical account of hemodynamic responses.", "provenance": "grouped", "evidence": {"origin": "local:PosiblesPapers/1-s2.0-S1053811907006489-main.pdf", "quote": "has been very important in providing a biophysically plausible framework for explaining different aspects of hemodynamic responses", "retrieved": "2026-10-05"}}, {"id": "ai", "slot": "topic_ai", "orbit": 1, "label": "Bayesian model selection among forward models", "detail": "Framed as comparing candidate observation models by model evidence.", "provenance": "grouped", "evidence": {"origin": "local:PosiblesPapers/1-s2.0-S1053811907006489-main.pdf", "quote": "This allows us to compare the ensuing models using Bayesian model selection.", "retrieved": "2026-10-05"}}, {"id": "prob", "slot": "problem", "orbit": 1, "label": "Which BOLD equation fits measured responses?", "detail": "Several formulations exist; the best one is unknown.", "provenance": "grouped", "evidence": {"origin": "local:PosiblesPapers/1-s2.0-S1053811907006489-main.pdf", "quote": "Given the importance of hemodynamic models for investigating BOLD responses and analyses of effective connectivity with DCM, the question arises which formulation is the best model for empirically measured BOLD responses.", "retrieved": "2026-10-05"} ing scheme finds the best effective connectivity among hidden neuronal states that explains the observed functional connectivity among haemodynamic responses.", "retrieved": "2026-10-05"}}, {"id": "appl", "slot": "application", "orbit": 1, "label": "Planned validation in Parkinson's and Huntington's disease", "detail": "Predictive validity is left to subsequent papers.", "provenance": "grouped", "evidence": {"origin": "local:PosiblesPapers/1-s2.0-S1053811913012135-main.pdf", "quote": "we will evaluate its construct validity in relation to stochastic DCM and its predictive validity in Parkinson's and Huntington's disease", "retrieved": "2026-10-05"}}, {"id": "fam", "slot": "family", "orbit": 2, "label": "Dynamic causal modeling for fMRI effective connectivity", "detail": "Family grouped from the pool abstracts.", "provenance": "grouped", "evidence": {"origin": "local:PosiblesPapers/1-s2.0-S1053811913012135-main.pdf", "quote": "a dynamic causal model (DCM) for resting state fMRI time series", "retrieved": "2026-10-05"}}, {"id": "nov", "slot": "novelty", "orbit": 1, "label": "Fitting cross spectra rather than time series", "detail": "The DCM is based upon observed functional connectivity as cross spectra.", "provenance": "grouped", "evidence": {"origin": "local:PosiblesPapers/1-s2.0-S1053811913012135-main.pdf", "quote": "based upon observed functional connectivity\u2014as measured by the cross spectra among different brain regions", "retrieved": "2026-10-05"}}, {"id": "res", "slot": "result", "orbit": 3, "label": "Face validity shown by simulations", "detail": "Validation of the scheme is by simulation only.", "provenance": "grouped", "evidence": {"origin": "local:PosiblesPapers/1-s2.0-S1053811913012135-main.pdf", "quote": "establishing its face validity using simulations", "retrieved": "2026-10-05"}}, {"id": "con", "slot": "conclusion", "orbit": 3, "label": "Cross spectra carry all second-order dependencies", "detail": "Why cross spectra are a sufficient summary for t e, most notably theoretical issues that remain unresolved", "retrieved": "2026-11-09"}}, {"id": "appl", "slot": "application", "orbit": 1, "label": "Alternative to classical solvers", "detail": "More feasible than FEM in some contexts.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s10915-022-01939-z", "quote": "by demonstrating their ability to be more feasible in some contexts than classical numerical techniques like Finite Element Method (FEM)", "retrieved": "2026-11-09"}}, {"id": "fam", "slot": "family", "orbit": 2, "label": "Physics-informed neural networks for inverse problems", "detail": "Networks that encode model equations.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s10915-022-01939-z", "quote": "Physics-Informed Neural Networks (PINN) are neural networks (NNs) that encode model equations", "retrieved": "2026-11-09"}}, {"id": "nov", "slot": "novelty", "orbit": 1, "label": "Review of PINN variants", "detail": "Vanilla PINN and its variants are covered.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s10915-022-01939-z", "quote": "as well as many other variants, such as physics-constrained neural networks (PCNN), variational hp-VPINN, and conservative PINN (CPINN)", "retrieved": "2026-11-09"}}, {"id": "res", "slot": "result", "orbit": 3, "label": "Customization is the main research thrust", "detail": "Activations, optimizers, architectures, losses.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s10915-022-01939-z", "quote": "most research has focused on customizing the PINN through different activation functions, gradient optimization techniques, neural network structures, and loss function structures", "retrieved": "2026-11-09"}}, {"id": "con", "slot": "conclusion", "orbit": 3, "label": "Advancement is still possible", "detail": "Theory is the open frontier.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1007/s10915-022-01939-z", "quote": "advancements are still possible", "retrieved": "2026-11-09"}}]}, {"id": "s31", "title": "Response estimation and system identification of dynamical systems via physics-informed neural networks", "planets": [{"id": "sun", "slot": "sun", "orbit": 0, "label": "Response estimation and system identification of dynamical systems via physics-informed neural networks", "detail": "Paper at the center of its system.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "this paper explores the use of Physics-Informed Neural Networks (PINNs), a class of physics-enhanced machine learning (PEML) techniques, for the identification and estimation of dynamical systems", "retrieved": "2026-11-09"}}, {"id": "app", "slot": "topic_app", "orbit": 1, "label": "Structural dynamics modelling", "detail": "Accurate models for monitoring, design and control.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "The accurate modelling of structural dynamics is crucial across numerous engineering applications", "retrieved": "2026-11-09"}}, {"id": "ai", "slot": "topic_ai", "orbit": 1, "label": "Physics-enhanced learning for identification", "detail": "PINNs embed physical laws in the loss.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "PINNs offer a unique advantage by embedding known physical laws directly into the neural network's loss function", "retrieved": "2026-11-09"}}, {"id": "prob", "slot": "problem", "orbit": 1, "label": "Sparse sensing and approximate models", "detail": "Sensor data is sparse and models imprecise.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "This challenge is further compounded in SHM, where sensor data is often sparse, making it difficult to fully observe the system's states.", "retrieved": "2026-11-09"}}, {"id": "appl", "slot": "application", "orbit": 1, "label": "Structural health monitoring", "detail": "Sparse-sensor SHM and inverse modelling.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "such as Structural Health Monitoring (SHM), structural design optimisation, and vibration control", "retrieved": "2026-11-09"}}, {"id": "fam", "slot": "family", "orbit": 2, "label": "Physics-informed neural networks for inverse problems", "detail": "Identification of dynamical systems with PINNs.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "a class of physics-enhanced machine learning (PEML) techniques", "retrieved": "2026-11-09"}}, {"id": "nov", "slot": "novelty", "orbit": 1, "label": "State and parameter estimation with PINNs", "detail": "Sparse-state, joint state-parameter and Bayesian estimation.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "joint state-parameter estimation, when both system response and parameters are unknown, and parameter estimation from full-field observation, within a Bayesian framework to quantify uncertainties", "retrieved": "2026-11-09"}}, {"id": "res", "slot": "result", "orbit": 3, "label": "PINNs are efficient across tasks", "detail": "Even in the presence of modelling errors.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "The results demonstrate that PINNs deliver an efficient tool across all aforementioned tasks, even in the presence of modelling errors.", "retrieved": "2026-11-09"}}, {"id": "con", "slot": "conclusion", "orbit": 3, "label": "Modelling errors hit parameters hardest", "detail": "Errors weigh more on parameter estimation.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1186/s40323-025-00291-9", "quote": "these errors tend to have a more significant impact on parameter estimation", "retrieved": "2026-1 ation and identifiability analysis with hybrid neural ordinary differential equations in computational biology", "planets": [{"id": "sun", "slot": "sun", "orbit": 0, "label": "Robust parameter estimation and identifiability analysis with hybrid neural ordinary differential equations in computational biology", "detail": "Paper at the center of its system.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1038/s41540-024-00460-3", "quote": "we present an approach for estimating model parameters and assessing their identifiability in situations where only partial knowledge of the system structure is available", "retrieved": "2026-11-09"}}, {"id": "app", "slot": "topic_app", "orbit": 1, "label": "Parameter estimation in computational biology", "detail": "Central problem of biological modelling.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1038/s41540-024-00460-3", "quote": "Parameter estimation is one of the central problems in computational modeling of biological systems.", "retrieved": "2026-11-09"}}, {"id": "ai", "slot": "topic_ai", "orbit": 1, "label": "Hybrid neural ODEs", "detail": "Neural networks capture unknown model parts.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1038/s41540-024-00460-3", "quote": "The partially known model is extended into a system of Hybrid Neural Ordinary Differential Equations, which captures the unknown portions of the system using neural networks.", "retrieved": "2026-11-09"}}, {"id": "prob", "slot": "problem", "orbit": 1, "label": "Partially known model structure", "detail": "Scientists must otherwise specify the full structure.", "provenance": "grouped", "evidence": {"origin": "https://doi.org/10.1038/s41540-024-00460-3", "quote": "Typically, scientists must fully specify the mathematical structure of the model, often expressed as a system of ordinary differential equations, to estimate the parameters.", "retrieved": "2026-11-09"}}, {"id": "appl", "slot": "applic <script>
const SCENE = JSON.parse(document.getElementById('atlas-data').textContent);
const ATLAS = SCENE.atlas;
const PLANETS = new Map();
const SYSTEMS = new Map();
ATLAS.systems.forEach(s => {
  SYSTEMS.set(s.id, s);
  s.planets.forEach(p => PLANETS.set(s.id + '.' + p.id, {system: s, planet: p}));
});
// The group a system belongs to: its first non-blank family label (the viewer's rule).
function familyLabel(s) {
  const fam = s ? s.planets.find(p => p.slot === 'family' && typeof p.label === 'string' && p.label.trim()) : null;
  return fam ? fam.label.trim() : '';
}
const side = document.getElementById('side');
const sideBody = document.getElementById('sidebody');
function line(tag, text, cls) {
  const el = document.createElement(tag);
  el.textContent = text;
  if (cls) el.className = cls;
  return el;
}

        if (!el) {
          el = document.createElement('div');
          el.textContent = b.s.name;
          el.title = 'Open this paper';
          el.addEventListener('click', () => select(b.s.key));
          nameLayer.pool.set(b.s.key, el);
          nameLayer.el.appendChild(el);
        }
        el.className = b.lit ? 'lit' : '';
        el.style.transform = 'translate(' + Math.round(b.x) + 'px,' + Math.round(b.y) + 'px)';
        el.style.display = '';
        shown.add(b.s.key);
      });
      nameLayer.pool.forEach((el, key) => { if (!shown.has(key)) el.style.display = 'none'; });
    }
    requestAnimationFrame(frame);
  }
  nameLayer.stop = false;
  namesDirty = true;
  if (!nameLayer.running) { nameLayer.running = true; requestAnimationFrame(frame); }
}
function stopNameLayer(remove) {
  nameLayer.stop = true;
  if (remove && nameLayer.el) { nameLayer.el.remove(); nameLayer.el = null; }
}
// Every dimming change goes through here, so the names know what is lit.
function dimTo(keep) {
  namesKeep = keep;
  namesDirty = true;
  if (viewer) viewer.setDim(keep);
}
const skyHost = document.getElementById('sky');
const gpuNote = document.getElementById('gpunote');
const viewButton = document.getElementById('viewmode');
const helpPanel = document.getElementById('panel');
const HELP_3D = helpPanel.textContent;
const HELP_2D = '2D view: drag to pan, wheel to zoom; turn and tilt change the angle. Hover a planet to trace its cross-system links; click to read it; double-click to center it.';
const NOTES = {
  none: '⚠ WebGL is not available here: showing the 2D constellation.',
  hang: '⚠ The 3D sky froze on this computer: switched to the lighter 2D constellation (the 3D view button tries it again).',
};
const viewerHooks = {
  onSelect: key => select(key),
  onHover: key => { hovered = key; dimTo(key ? hoverKeep(key) : (selectedKeep || familyKeep())); },
  afterDraw: drawNames,
};
let viewer = null;
let view = null;
let pageHidden = document.hidden;
let dashboardPaused = false;
function mountView(mode, reason) {
  const layout = viewer ? viewer.layout() : 'sky';
  if (viewer && viewer.dispose) viewer.dispose();
  stopNameLayer(true);
  viewer = null;
  skyHost.textContent = '';
  if (mode === '3d') viewer = AtlasViewer.mount(skyHost, SCENE, viewerHooks);
  if (!viewer) {
    if (mode === '3d') reason = 'none';
    mode = '2d';
    skyHost.textContent = '';
    viewer = FlatViewer.mount(skyHost, SCENE, viewerHooks);
  }
  view = mode;
  if (layout !== 'sky') viewer.setLayout(layout);
  dimTo(familyKeep());
  gpuNote.textContent = NOTES[reason] || '';
  gpuNote.hidden = !NOTES[reason];
  helpPanel.textContent = mode === '2d' ? HELP_2D : HELP_3D;
  viewButton.textContent = mode === '2d' ? '3D view' : '2D view';
  viewButton.disabled = mode === '2d' && webglSupport() === 'none';
  if (mode === '3d') startNameLayer(skyHost);
  applyVisibility();
  syncRotate();
  if (mode === '3d' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) viewer.rotate(false);
  if (mode === '3d' && (reason === 'auto' || reason === 'software')) watchFrameRate();
}
// Draw nothing while nobody can see the sky: the page is hidden (another
// browser tab, a minimized window) or the dashboard paused it.
function applyVisibility() {
  if (!viewer) return;
  if (pageHidden || dashboardPaused) {
    viewer.pause();
    stopNameLayer(false);
  } else {
    viewer.resume();
    if (view === '3d') startNameLayer(skyHost);
  }
}
document.addEventListener('visibilitychange', () => { pageHidden = document.hidden; applyVisibility(); });
// The one rule that drops an automatically opened 3D sky to 2D: it hangs.
// A slow sky is not a hung one: software rendering without a GPU draws 10 to
// 30 frames a second and stays usable, so it keeps the 3D sky. Watching the
// first seconds after opening, the sky hangs when one frame takes longer than
// HANG_FRAME_MS or the average falls under HANG_FPS. Only the automatic pick
// is watched, and the fallback is not stored: the next visit tries 3D again.
const HANG_FRAME_MS = 1000;
const HANG_FPS = 5;
function hangs(frames, elapsedMs, worstFrameMs) {
  return worstFrameMs > HANG_FRAME_MS || (elapsedMs >= 3000 && frames * 1000 / elapsedMs < HANG_FPS);
}
function watchFrameRate() {
  let frames = 0, start = 0, last = 0, worst = 0;
  const mounted = viewer;
  function count(t) {
    if (viewer !== mounted || pageHidden || dashboardPaused) return;
    if (!start) start = t;
    if (last) worst = Math.max(worst, t - last);
    last = t;
    frames++;
    if (hangs(frames, t - start, worst)) { mountView('2d', 'hang'); return; }
    if (t - start < 3000) requestAnimationFrame(count);
  }
  setTimeout(() => requestAnimationFrame(count), 1000);
}
viewButton.addEventListener('click', () => {
  const next = view === '2d' ? '3d' : '2d';
  storeView(next);
  mountView(next, 'chosen');
});
const rotateButton = document.getElementById('autorotate');
function syncRotate() {
  if (!viewer) return;
  const on = viewer.rotating();
  rotateButton.classList.toggle('on', on);
  rotateButton.textContent = on ? '⏸ rotation' : '▶ rotation';
}
rotateButton.addEventListener('click', () => { if (viewer) { viewer.rotate(); syncRotate(); } });
skyHost.addEventListener('pointerdown', () => setTimeout(syncRotate, 0));
skyHost.addEventListener('wheel', () => setTimeout(syncRotate, 0), {passive: true});
const STEP = Math.PI / 12;
function act(id, fn) {
  document.getElementById(id).addEventListener('click', () => { if (viewer) { fn(); syncRotate(); } });
}
act('spinleft', () => viewer.spin(STEP));
act('spinright', () => viewer.spin(-STEP));
act('tiltup', () => viewer.tilt(STEP / 2));
act('tiltdown', () => viewer.tilt(-STEP / 2));
const namesButton = document.getElementById('names');
namesButton.addEventListener('click', () => {
  showNames = !showNames;
  namesDirty = true;
  namesButton.classList.toggle('on', showNames);
  if (viewer) viewer.refresh();
});
// Keep the hover label inside the sky: the viewer centers it over the planet.
skyHost.addEventListener('pointermove', () => {
  const tip = skyHost.querySelector('.atlas-tip');
  if (!tip || tip.style.display === 'none') return;
  const w = tip.offsetWidth, h = tip.offsetHeight, W = skyHost.clientWidth;
  tip.style.left = Math.min(Math.max(parseFloat(tip.style.left), w / 2 + 4), W - w / 2 - 4) + 'px';
  tip.style.transform = parseFloat(tip.style.top) < h * 1.3 + 4 ? 'translate(-50%, 30%)' : 'translate(-50%,-130%)';
});
const initial = chooseView();
mountView(initial.mode, initial.reason);
function resetView() {
  if (!viewer) return;
  activeFam = null;
  document.querySelectorAll('.famchip').forEach(c => c.classList.remove('on'));
  viewer.reset();
  dimTo(null);
  syncRotate();
}
const layoutButton = document.getElementById('grouplayout');
function applyLayout(mode) {
  if (!viewer) return;
  const now = viewer.setLayout(mode);
  layoutButton.classList.toggle('on', now === 'groups');
  tellParent({type: 'atlas-layout', mode: String(now)});
}
function toggleLayout() {
  if (viewer) applyLayout(viewer.layout() === 'groups' ? 'sky' : 'groups');
}
document.getElementById('zoomin').addEventListener('click', () => viewer && viewer.zoom(1.5));
document.getElementById('zoomout').addEventListener('click', () => viewer && viewer.zoom(1 / 1.5));
document.getElementById('zoomreset').addEventListener('click', resetView);
layoutButton.addEventListener('click', toggleLayout);
// A citation opened from the dashboard: fly to its paper and open its summary.
function focusReference(key) {
  const system = PLANETS.get(key).system;
  if (viewer && typeof viewer.focus === 'function') viewer.focus(key);
  select(key);
  tellParent({type: 'atlas-focused', key: String(key), system: {id: String(system.id), title: String(system.title || '')}});
}
// Dashboard commands: only from the framing parent, only the named few.
const COMMANDS = {
  'group-layout': () => applyLayout('groups'),
  'sky-layout': () => applyLayout('sky'),
  'toggle-layout': toggleLayout,
  'reset': resetView,
  'pause': () => { dashboardPaused = true; applyVisibility(); },
  'resume': () => { dashboardPaused = false; applyVisibility(); },
  'view-2d': () => { storeView('2d'); mountView('2d', 'chosen'); },
  'view-3d': () => { storeView('3d'); mountView('3d', 'chosen'); },
};
window.addEventListener('message', event => {
  if (!(event.source === window.parent) || window.parent === window) return;
  const data = event.data;
  if (!data || typeof data !== 'object' || data.type !== 'atlas-command') return;
  // A cited reference opened from the dashboard: centre its system, light it
  // and dim the rest, and say so, so the dashboard knows this page can.
  if (data.command === 'focus' && typeof data.key === 'string' && PLANETS.has(data.key)) {
    focusReference(data.key);
    return;
  }
  if (typeof data.command !== 'string' || !Object.prototype.hasOwnProperty.call(COMMANDS, data.command)) return;
  COMMANDS[data.command]();
});
if (viewer) tellParent({type: 'atlas-layout', mode: String(viewer.layout())});
const chips = document.getElementById('famchips');
const fams = {};
ATLAS.systems.forEach(s => s.planets.forEach(p => {
  if (p.slot === 'family') fams[p.label] = (fams[p.label] || 0) + 1;
}));
Object.keys(fams).sort().forEach(label => {
  const b = document.createElement('button');
  b.textContent = label + ' (' + fams[label] + ')';
  b.className = 'famchip';
  b.addEventListener('click', () => {
    activeFam = (activeFam === label) ? null : label;
    document.querySelectorAll('.famchip').forEach(c => c.classList.toggle('on', c === b && activeFam === label));
    dimTo(familyKeep());
  });
  chips.appendChild(b);
});
</script>
</body>
